<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080B">
<title>Admin - Ignition Arena</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
body{background:var(--bg)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side nav{flex-direction:row;flex-wrap:wrap}}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--line);background:#090B10}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.side .brand b{display:block;font-family:var(--display);font-size:14px;line-height:1.15}
.side .brand span{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--cyan)}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--text2);font-weight:600;cursor:pointer;text-align:left}
.side nav button:hover{background:#121722;color:var(--text)}
.side nav button.on{background:#121A26;color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}
.side nav svg{flex:0 0 auto}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side .foot a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px}
.side .foot a:hover{background:#121722;color:var(--text)}
main{padding:24px 28px 60px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-family:var(--display);font-size:26px}
.ph p{margin:6px 0 0;color:var(--muted)}
.g2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:1200px){.g2{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{margin:0 0 14px;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.2em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.lm-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:4px 0 16px}
.lm-t{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:#0B0E14;border:1px solid var(--line)}
.lm-t.red{box-shadow:inset 3px 0 0 var(--red)}.lm-t.blue{box-shadow:inset -3px 0 0 var(--blue);flex-direction:row-reverse;text-align:right}
.lm-t img{width:64px;height:48px;border-radius:8px;object-fit:cover}
.lm-t b{display:block;font-size:15px}
.lm-t small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{padding:10px 12px;border-radius:10px;background:#0B0E14;border:1px solid var(--line)}
.kpi small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:20px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.step{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);margin:14px 0 8px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:#0B0E14;cursor:pointer;text-align:left;min-height:84px;transition:border-color .2s}
.tpl:hover{border-color:#47526A}
.tpl.on{border-color:var(--cyan);background:#0A1A20;box-shadow:0 0 0 3px #22E5FF22}
.tpl b{font-size:14px}.tpl span{font-size:12px;color:var(--muted);line-height:1.35}
.tpl .live{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#06121A;background:var(--cyan);padding:2px 6px;border-radius:4px;display:none}
.tpl.on .live{display:block}
.preview{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#000}
.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.onair{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;padding:4px 8px;border-radius:6px;background:#FF3B4E;color:#fff;display:flex;gap:6px;align-items:center;z-index:2}
.onair i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.feed{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.fi{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;padding:8px 10px;border-radius:8px;background:#0B0E14;border:1px solid var(--line)}
.fi time{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
.fi.bet{border-color:#3B320A}.fi.result{border-color:#3D5214}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr:hover td{background:#0D1118}
.tw{overflow-x:auto}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tc{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.tc img{aspect-ratio:4/3;width:100%;object-fit:cover}
.tc .in{padding:12px 14px 14px}
.tc b{display:block;font-size:16px}
.tc .bot{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tc .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.tc .acts{display:flex;gap:6px;margin-top:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.modal{padding:22px;width:min(640px,100%)}
.modal h2{margin:0 0 16px;font-family:var(--display);font-size:20px}
.phprev{display:flex;align-items:center;gap:14px}
.phprev img{width:120px;height:90px;border-radius:10px;object-fit:cover;border:1px solid var(--line2)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{width:min(380px,100%);padding:28px;text-align:center}
.pin{font-family:var(--mono);font-size:28px;letter-spacing:.5em;text-align:center}
.danger{border-color:#5A2230}
.linkcell{display:flex;gap:6px;align-items:center}
.linkcell code{font-family:var(--mono);font-size:12px;color:var(--text2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.qrbig{background:#fff;padding:14px;border-radius:14px;width:260px;margin:0 auto}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--text2);min-height:44px}
.toggle input{width:20px;height:20px;accent-color:var(--cyan)}
.winbtn{min-height:52px;flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
